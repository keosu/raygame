name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

env:
  XMAKE_VERSION: '3.1.1'

jobs:
  format:
    name: C++ formatting
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install clang-format==19.1.5
      - run: python scripts/format-code.py --check

  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
        mode: [debug, release]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Install Linux deps (raylib runtime libs)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1-mesa-dev libx11-dev libxrandr-dev \
            libxi-dev libxcursor-dev libxinerama-dev libxext-dev libwayland-dev \
            libxkbcommon-dev

      - name: Setup xmake
        uses: xmake-io/github-action-setup-xmake@v1
        with:
          xmake-version: ${{ env.XMAKE_VERSION }}

      - name: Configure Windows (MSVC)
        # Configure Windows explicitly to avoid picking up a MinGW toolchain.
        if: runner.os == 'Windows'
        run: xmake f -p windows -a x64 --toolchain=msvc -m ${{ matrix.mode }} --build_examples=y --build_tests=y --example_console=n -y

      - name: Configure Linux
        if: runner.os == 'Linux'
        run: xmake f -m ${{ matrix.mode }} --build_examples=y --build_tests=y -y

      - name: Build examples
        run: xmake build -y

      - name: Build tests
        run: xmake build -y tests

      - name: Build FORGE tests
        run: xmake build -y forge_tests

      - name: Run tests
        run: xmake run tests

      - name: Run FORGE tests
        run: xmake run forge_tests

      - name: Build and run campaign game tests
        run: |
          xmake build -y campaign_tests
          xmake run campaign_tests

      - name: Verify installed SDK from an independent project
        run: xmake lua scripts/verify-sdk.lua

      - name: Verify Box2D and Goo Journey campaign
        run: |
          xmake build -y goo_tests
          xmake run goo_tests 120

      - name: Verify Windows embedded icons
        if: runner.os == 'Windows'
        run: |
          ./scripts/verify-windows-icons.ps1
          ./scripts/verify-windows-icons.ps1 -BinaryDirectory bin/forge_runner -Games forge_runner -IconDirectory examples/forge_runner/resources -IconNames forge

      - name: Verify standalone FORGE SDK build
        if: runner.os == 'Windows'
        run: ./scripts/build-forge.ps1 -Mode ${{ matrix.mode }} -Verify -SkipGraphics

      - name: Upload FORGE reference game
        uses: actions/upload-artifact@v4
        with:
          name: raygame-forge-${{ runner.os == 'Windows' && 'windows-x64' || 'linux-x86_64' }}-${{ matrix.mode }}
          path: |
            bin/forge_runner/forge_runner${{ runner.os == 'Windows' && '.exe' || '' }}
            bin/forge_runner/assets/
            bin/forge_runner/README.md
            bin/forge_runner/THIRD_PARTY_NOTICES.md
          if-no-files-found: error
          retention-days: 14

      - name: Upload Windows games and assets
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: raygame-windows-x64-${{ matrix.mode }}
          path: |
            bin/space_shooter.exe
            bin/bouncing_balls.exe
            bin/neon_breakout.exe
            bin/bullet_hell.exe
            bin/engine_lab.exe
            bin/engine_lab-README.md
            bin/marble_temple.exe
            bin/marble_temple-README.md
            bin/garden_guard.exe
            bin/garden_guard-README.md
            bin/goo_journey.exe
            bin/goo_journey-README.md
            bin/*.dll
            bin/assets/
            bin/forge_runner/forge_runner.exe
            bin/forge_runner/assets/
            bin/forge_runner/README.md
            bin/forge_runner/THIRD_PARTY_NOTICES.md
          if-no-files-found: error
          retention-days: 14

  android:
    name: Android ARM64 APKs
    runs-on: windows-2022
    timeout-minutes: 45
    defaults:
      run:
        shell: pwsh

    steps:
      - uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK and NDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-35 build-tools;35.0.0 ndk;28.2.13676358'

      - name: Setup xmake
        uses: xmake-io/github-action-setup-xmake@v1
        with:
          xmake-version: ${{ env.XMAKE_VERSION }}

      - name: Check Android tool discovery
        run: xmake lua tests/android_tools.lua

      - name: Build and verify nine APKs including Goo Journey
        run: |
          xmake android --mode=release --sdk="$env:ANDROID_HOME" `
            --ndk="$env:ANDROID_HOME/ndk/28.2.13676358" --jdk="$env:JAVA_HOME" --build-tools=35.0.0

      - name: Stage Android download artifact
        run: |
          New-Item -ItemType Directory -Path build/android/artifact -Force | Out-Null
          Copy-Item -Path bin/android/arm64-v8a/release/*.apk -Destination build/android/artifact
          Copy-Item -LiteralPath build/android/verification-release.json `
            -Destination build/android/artifact/verification.json

      - name: Upload Android APKs and verification report
        uses: actions/upload-artifact@v4
        with:
          name: raygame-android-arm64-release
          path: |
            build/android/artifact/*.apk
            build/android/artifact/verification.json
          if-no-files-found: error
          retention-days: 14
